<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cxeify</title>
    <style>
        :root {
            --accent-color: #1DB954;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html,
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            color: #ffffff;
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            margin: 0;
            padding: 0;
            position: relative;
        }

        body {
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* Album art background without any GPU filters — a dark vignette layer
           above it provides the contrast text needs. Avoids compositor churn in
           embedded Chromium hosts like iCUE. */
        .bg-layer {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            z-index: -2;
            pointer-events: none;
        }

        .bg-vignette {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle at center, rgba(0, 0, 0, 0.7) 0%, rgba(0, 0, 0, 0.92) 100%);
            z-index: -1;
            pointer-events: none;
        }

        .container {
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 4vh;
            position: relative;
            z-index: 1;
        }

        #player-screen {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 4vh;
            width: 100%;
            max-width: 90vw;
        }

        .main-content {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 3vh;
            width: 100%;
        }

        .track-info {
            text-align: center;
            width: 100%;
            max-width: 80vw;
            text-shadow: 0 2px 10px rgba(0, 0, 0, 0.8);
        }

        .track-info h2 {
            font-size: clamp(2.5rem, 6vw, 5rem);
            margin-bottom: 1vh;
            font-weight: 700;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .track-info p {
            font-size: clamp(1.8rem, 4vw, 3rem);
            opacity: 0.85;
            margin-bottom: 0;
        }

        .progress-container {
            display: flex;
            align-items: center;
            gap: 2vw;
            width: 100%;
            max-width: 70vw;
        }

        .progress-container span {
            font-size: clamp(1.2rem, 2.5vw, 2rem);
            opacity: 0.8;
            min-width: 5vw;
            text-shadow: 0 1px 5px rgba(0, 0, 0, 0.5);
        }

        .progress-bar {
            flex: 1;
            height: clamp(14px, 2.5vh, 24px);
            background: rgba(255, 255, 255, 0.25);
            border-radius: 1.5vh;
            cursor: pointer;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.3);
            position: relative;
            overflow: visible;
        }

        .progress-fill {
            height: 100%;
            background: var(--accent-color);
            border-radius: 1.5vh;
            box-shadow: 0 0 10px var(--accent-color);
            position: relative;
        }

        .progress-fill::after {
            content: '';
            position: absolute;
            right: 0;
            top: 50%;
            transform: translate(50%, -50%);
            width: clamp(16px, 3vh, 28px);
            height: clamp(16px, 3vh, 28px);
            background: var(--accent-color);
            border-radius: 50%;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.4);
            transition: transform 0.2s ease;
        }

        .progress-bar:hover .progress-fill::after,
        .progress-bar:active .progress-fill::after {
            transform: translate(50%, -50%) scale(1.2);
        }

        .controls {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 3vw;
        }

        .control-btn {
            width: clamp(70px, 10vw, 120px);
            height: clamp(70px, 10vw, 120px);
            border: none;
            background: rgba(40, 40, 55, 0.55);
            color: white;
            border-radius: 50%;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: transform 0.2s ease, background 0.2s ease;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.4);
        }

        .control-btn:hover {
            background: rgba(255, 255, 255, 0.25);
            transform: scale(1.1);
        }

        .control-btn svg {
            width: clamp(35px, 5vw, 60px);
            height: clamp(35px, 5vw, 60px);
        }

        .control-btn-small {
            width: clamp(50px, 7vw, 80px);
            height: clamp(50px, 7vw, 80px);
        }

        .control-btn-small svg {
            width: clamp(25px, 3.5vw, 40px);
            height: clamp(25px, 3.5vw, 40px);
        }

        .control-btn.active {
            background: var(--accent-color) !important;
        }

        .control-btn.active svg {
            fill: white !important;
        }

        .repeat-one-indicator {
            position: absolute;
            font-size: clamp(10px, 1.5vw, 14px);
            font-weight: bold;
            bottom: clamp(12px, 2vw, 18px);
        }

        .control-btn-large {
            width: clamp(90px, 13vw, 150px) !important;
            height: clamp(90px, 13vw, 150px) !important;
            background: var(--accent-color) !important;
        }

        .control-btn-large:hover {
            filter: brightness(1.1);
        }

        .control-btn-large svg {
            width: clamp(45px, 6.5vw, 75px) !important;
            height: clamp(45px, 6.5vw, 75px) !important;
        }

        .volume-container {
            display: flex;
            align-items: center;
            gap: 2vw;
            width: 100%;
            max-width: 50vw;
            padding: 2vh 0;
        }

        .volume-icon {
            width: clamp(30px, 4vw, 50px);
            height: clamp(30px, 4vw, 50px);
            opacity: 0.8;
            flex-shrink: 0;
        }

        .volume-slider {
            flex: 1;
            height: clamp(12px, 2vh, 20px);
            border-radius: 1vh;
            background: rgba(255, 255, 255, 0.25);
            outline: none;
            -webkit-appearance: none;
            appearance: none;
            touch-action: none;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.3);
        }

        .volume-slider::-webkit-slider-runnable-track {
            height: 100%;
            border-radius: 1vh;
        }

        .volume-slider::-moz-range-track {
            height: 100%;
            border-radius: 1vh;
            background: transparent;
        }

        .volume-slider::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: clamp(30px, 4vw, 50px);
            height: clamp(30px, 4vw, 50px);
            border-radius: 50%;
            background: var(--accent-color);
            cursor: pointer;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.4);
            transition: all 0.2s ease;
            margin-top: calc((clamp(12px, 2vh, 20px) - clamp(30px, 4vw, 50px)) / 2);
        }

        .volume-slider::-webkit-slider-thumb:hover {
            transform: scale(1.2);
        }

        .volume-slider::-moz-range-thumb {
            width: clamp(30px, 4vw, 50px);
            height: clamp(30px, 4vw, 50px);
            border-radius: 50%;
            background: var(--accent-color);
            cursor: pointer;
            border: none;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.4);
        }

        .hidden {
            display: none !important;
        }

        .setup-message {
            background: rgba(255, 196, 0, 0.2);
            padding: 1.5rem;
            border-radius: 10px;
            margin-top: 2rem;
        }

        .setup-message a {
            color: #1ed760;
            text-decoration: none;
            font-weight: bold;
        }

        .error-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.92);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1000;
            animation: fadeIn 0.3s ease;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
            }

            to {
                opacity: 1;
            }
        }

        .error-content {
            text-align: center;
            padding: 3rem;
            max-width: 80vw;
        }

        .error-icon {
            font-size: clamp(3rem, 8vw, 5rem);
            margin-bottom: 1.5rem;
        }

        .error-title {
            font-size: clamp(1.5rem, 4vw, 2.5rem);
            font-weight: 600;
            margin-bottom: 1rem;
            color: #ff6b6b;
        }

        .error-message {
            font-size: clamp(1rem, 2.5vw, 1.3rem);
            opacity: 0.8;
            margin-bottom: 2rem;
            line-height: 1.5;
        }

        .error-button {
            padding: clamp(12px, 2vh, 16px) clamp(30px, 5vw, 50px);
            font-size: clamp(14px, 2.5vw, 18px);
            background: var(--accent-color);
            color: white;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(29, 185, 84, 0.4);
        }

        .error-button:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(29, 185, 84, 0.6);
        }

        .error-button:active {
            transform: translateY(0);
        }

        /* Overlay Icons (Playlist + Queue) */
        .overlay-icon {
            position: fixed;
            top: 20px;
            width: clamp(50px, 7vw, 80px);
            height: clamp(50px, 7vw, 80px);
            background: rgba(0, 0, 0, 0.55);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: transform 0.2s ease, background 0.2s ease, border-color 0.2s ease;
            z-index: 100;
            border: 2px solid rgba(255, 255, 255, 0.1);
        }

        #playlist-icon {
            right: 20px;
        }

        #queue-icon {
            right: calc(30px + clamp(50px, 7vw, 80px));
        }

        .overlay-icon:hover {
            background: rgba(0, 0, 0, 0.7);
            transform: scale(1.1);
            border-color: var(--accent-color);
        }

        .overlay-icon svg {
            width: 60%;
            height: 60%;
            fill: white;
        }

        /* Playlist icon is always visible now */

        /* Playlist Overlay */
        .playlist-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.96);
            z-index: 200;
            display: flex;
            flex-direction: column;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease;
        }

        .playlist-overlay.active {
            opacity: 1;
            pointer-events: all;
        }

        .playlist-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 20px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }

        .playlist-header-content {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .playlist-header-image {
            width: 60px;
            height: 60px;
            border-radius: 8px;
            object-fit: cover;
        }

        .playlist-header-info h3 {
            font-size: clamp(16px, 3vw, 20px);
            margin-bottom: 5px;
        }

        .playlist-header-info p {
            font-size: clamp(12px, 2vw, 14px);
            opacity: 0.6;
        }

        .playlist-close-btn {
            width: 40px;
            height: 40px;
            background: rgba(255, 255, 255, 0.1);
            border: none;
            border-radius: 50%;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s ease;
        }

        .playlist-close-btn:hover {
            background: rgba(255, 255, 255, 0.2);
            transform: scale(1.1);
        }

        .playlist-close-btn svg {
            width: 20px;
            height: 20px;
            fill: white;
        }

        .playlist-tracks {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
        }

        /* Custom Scrollbar */
        .playlist-tracks::-webkit-scrollbar {
            width: 12px;
        }

        .playlist-tracks::-webkit-scrollbar-track {
            background: rgba(255, 255, 255, 0.05);
            border-radius: 10px;
            margin: 10px 0;
        }

        .playlist-tracks::-webkit-scrollbar-thumb {
            background: var(--accent-color);
            border-radius: 10px;
            border: 2px solid rgba(0, 0, 0, 0.95);
        }

        .playlist-tracks::-webkit-scrollbar-thumb:hover {
            background: var(--accent-color);
            filter: brightness(1.2);
        }

        .playlist-tracks::-webkit-scrollbar-thumb:active {
            background: var(--accent-color);
            filter: brightness(1.4);
        }

        .playlist-track {
            display: flex;
            align-items: center;
            gap: 15px;
            padding: 12px;
            border-radius: 8px;
            transition: all 0.2s ease;
            margin-bottom: 8px;
        }

        .playlist-track.current {
            background: rgba(29, 185, 84, 0.2);
            border-left: 3px solid var(--accent-color);
        }

        .playlist-track-number {
            min-width: 30px;
            text-align: center;
            font-size: 14px;
            opacity: 0.6;
        }

        .playlist-track.current .playlist-track-number {
            opacity: 1;
            color: var(--accent-color);
            font-weight: bold;
        }

        .playlist-track-image {
            width: 50px;
            height: 50px;
            border-radius: 4px;
            object-fit: cover;
        }

        .playlist-track-info {
            flex: 1;
            min-width: 0;
        }

        .playlist-track-name {
            font-size: clamp(14px, 2.5vw, 16px);
            font-weight: 500;
            margin-bottom: 4px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .playlist-track-artist {
            font-size: clamp(12px, 2vw, 14px);
            opacity: 0.6;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .playlist-track-play-btn {
            width: 45px;
            height: 45px;
            min-width: 45px;
            background: rgba(255, 255, 255, 0.1);
            border: none;
            border-radius: 50%;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s ease;
            flex-shrink: 0;
        }

        .playlist-track-play-btn:hover {
            background: var(--accent-color);
            transform: scale(1.1);
        }

        .playlist-track-play-btn:active {
            transform: scale(0.95);
        }

        .playlist-track-play-btn svg {
            width: 20px;
            height: 20px;
            fill: white;
        }

        .playlist-loading {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 15px;
            height: 200px;
            font-size: 18px;
            opacity: 0.6;
        }

        /* Loading Spinner */
        .spinner {
            width: 40px;
            height: 40px;
            border: 4px solid rgba(255, 255, 255, 0.1);
            border-top-color: var(--accent-color);
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        /* Scope Re-auth Banner */
        .scope-banner {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            background: rgba(255, 180, 0, 0.95);
            color: #1a1a1a;
            padding: clamp(10px, 1.5vh, 14px) clamp(16px, 3vw, 24px);
            z-index: 300;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: clamp(12px, 2vw, 20px);
            font-weight: 600;
            font-size: clamp(13px, 1.8vw, 16px);
            box-shadow: 0 2px 12px rgba(0, 0, 0, 0.4);
            flex-wrap: wrap;
            text-align: center;
        }

        .scope-banner a {
            text-decoration: none;
            color: inherit;
        }

        .scope-banner button {
            padding: clamp(6px, 1vh, 10px) clamp(14px, 2vw, 22px);
            background: #1a1a1a;
            color: #fff;
            border: none;
            border-radius: 999px;
            cursor: pointer;
            font-weight: 700;
            font-size: inherit;
            font-family: inherit;
            transition: transform 0.15s ease, background 0.15s ease;
        }

        .scope-banner button:hover {
            background: #000;
            transform: scale(1.04);
        }

        /* Toast */
        .toast {
            position: fixed;
            left: 50%;
            bottom: clamp(30px, 6vh, 60px);
            transform: translate(-50%, 30px);
            background: rgba(20, 20, 25, 0.92);
            color: #fff;
            padding: clamp(10px, 1.8vh, 16px) clamp(20px, 3vw, 30px);
            border-radius: 999px;
            font-size: clamp(14px, 2vw, 18px);
            font-weight: 500;
            display: flex;
            align-items: center;
            gap: 10px;
            border: 1px solid rgba(255, 255, 255, 0.15);
            box-shadow: 0 6px 20px rgba(0, 0, 0, 0.5);
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.25s ease, transform 0.25s ease;
            z-index: 500;
            white-space: nowrap;
        }

        .toast.visible {
            opacity: 1;
            transform: translate(-50%, 0);
        }

        .toast svg {
            width: clamp(18px, 2.5vw, 22px);
            height: clamp(18px, 2.5vw, 22px);
            flex-shrink: 0;
            fill: var(--accent-color);
        }

        /* Queue Tabs */
        .queue-tabs {
            display: flex;
            gap: 8px;
            flex: 1;
        }

        .queue-tab {
            padding: 8px 18px;
            background: transparent;
            border: none;
            color: rgba(255, 255, 255, 0.55);
            font-size: clamp(14px, 2.5vw, 18px);
            font-weight: 600;
            cursor: pointer;
            border-bottom: 3px solid transparent;
            transition: all 0.2s ease;
            font-family: inherit;
        }

        .queue-tab:hover {
            color: rgba(255, 255, 255, 0.9);
        }

        .queue-tab.active {
            color: #ffffff;
            border-bottom-color: var(--accent-color);
        }

        /* Load More Button */
        .load-more-btn {
            display: block;
            width: calc(100% - 40px);
            margin: 20px auto;
            padding: 15px;
            background: rgba(255, 255, 255, 0.05);
            border: 2px solid var(--accent-color);
            border-radius: 8px;
            color: var(--accent-color);
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
        }

        .load-more-btn:hover {
            background: var(--accent-color);
            color: white;
            transform: translateY(-2px);
        }

        .load-more-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
        }

        .load-more-btn:disabled:hover {
            background: rgba(255, 255, 255, 0.05);
            color: var(--accent-color);
        }

    </style>
</head>

<body>
    <div class="bg-layer" id="bg-layer"></div>
    <div class="bg-vignette"></div>
    <div class="container">
        <div id="setup-screen" style="text-align: center;">
            <h1>🎵</h1>
            <p>Cxeify</p>
            <div class="setup-message">
                <p>⚠️ Setup erforderlich!</p>
                <p>Öffne im Browser:</p>
                <p><a href="http://127.0.0.1:3000/setup">http://127.0.0.1:3000/setup</a></p>
            </div>
        </div>

        <div id="player-screen" class="hidden">
            <img id="album-image" src="" alt="Album Cover" style="display: none;">
            <div class="main-content">
                <div class="track-info">
                    <h2 id="track-name">Kein Track</h2>
                    <p id="artist-name">Kein Künstler</p>
                </div>
                <div class="progress-container">
                    <span id="current-time">0:00</span>
                    <div class="progress-bar" id="progress-bar">
                        <div id="progress-fill" class="progress-fill"></div>
                    </div>
                    <span id="duration">0:00</span>
                </div>
                <div class="controls">
                    <div class="control-btn control-btn-small" aria-hidden="true" style="visibility: hidden; background: transparent; box-shadow: none;"></div>
                    <button id="shuffle-btn" class="control-btn control-btn-small" title="Shuffle">
                        <svg viewBox="0 0 24 24" fill="currentColor">
                            <path
                                d="M10.59 9.17L5.41 4 4 5.41l5.17 5.17 1.42-1.41zM14.5 4l2.04 2.04L4 18.59 5.41 20 17.96 7.46 20 9.5V4h-5.5zm.33 9.41l-1.41 1.41 3.13 3.13L14.5 20H20v-5.5l-2.04 2.04-3.13-3.13z" />
                        </svg>
                    </button>
                    <button id="prev-btn" class="control-btn">
                        <svg viewBox="0 0 24 24" fill="currentColor">
                            <path d="M6 6h2v12H6zm3.5 6l8.5 6V6z" />
                        </svg>
                    </button>
                    <button id="play-pause-btn" class="control-btn control-btn-large">
                        <svg id="play-icon" viewBox="0 0 24 24" fill="currentColor">
                            <path d="M8 5v14l11-7z" />
                        </svg>
                        <svg id="pause-icon" class="hidden" viewBox="0 0 24 24" fill="currentColor">
                            <path d="M6 4h4v16H6V4zm8 0h4v16h-4V4z" />
                        </svg>
                    </button>
                    <button id="next-btn" class="control-btn">
                        <svg viewBox="0 0 24 24" fill="currentColor">
                            <path d="M6 18l8.5-6L6 6v12zM16 6v12h2V6h-2z" />
                        </svg>
                    </button>
                    <button id="repeat-btn" class="control-btn control-btn-small" title="Repeat Off">
                        <svg viewBox="0 0 24 24" fill="currentColor">
                            <path d="M7 7h10v3l4-4-4-4v3H5v6h2V7zm10 10H7v-3l-4 4 4 4v-3h12v-6h-2v4z" />
                        </svg>
                        <span id="repeat-one" class="repeat-one-indicator hidden">1</span>
                    </button>
                    <button id="like-btn" class="control-btn control-btn-small" title="Add to Liked Songs">
                        <svg id="like-icon-outline" viewBox="0 0 24 24" fill="currentColor">
                            <path d="M16.5 3c-1.74 0-3.41.81-4.5 2.09C10.91 3.81 9.24 3 7.5 3 4.42 3 2 5.42 2 8.5c0 3.78 3.4 6.86 8.55 11.54L12 21.35l1.45-1.32C18.6 15.36 22 12.28 22 8.5 22 5.42 19.58 3 16.5 3zm-4.4 15.55l-.1.1-.1-.1C7.14 14.24 4 11.39 4 8.5 4 6.5 5.5 5 7.5 5c1.54 0 3.04.99 3.57 2.36h1.87C13.46 5.99 14.96 5 16.5 5c2 0 3.5 1.5 3.5 3.5 0 2.89-3.14 5.74-7.9 10.05z" />
                        </svg>
                        <svg id="like-icon-filled" class="hidden" viewBox="0 0 24 24" fill="currentColor">
                            <path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z" />
                        </svg>
                    </button>
                </div>
                <div class="volume-container">
                    <svg class="volume-icon" viewBox="0 0 24 24" fill="currentColor">
                        <path
                            d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02z" />
                    </svg>
                    <input type="range" id="volume-slider" min="0" max="100" value="50" class="volume-slider">
                </div>
            </div>
        </div>
    </div>

    <script>
        let currentPlaybackState = null;
        let isAdjustingVolume = false;
        let isSeeking = false;
        let volumeDebounceTimer = null;
        let lastSetVolume = null;
        let errorState = { hasError: false, retryCount: 0 };
        let lastAlbumArtUrl = null;
        let localProgress = { ms: 0, duration: 0, syncedAt: 0, isPlaying: false };

        // desc: Only touch DOM when the value actually changes — avoids the
        // per-poll style recalc cascade that flashes iCUE's embedded compositor.
        function setText(el, value) {
            if (el.textContent !== value) el.textContent = value;
        }
        function setHidden(el, hidden) {
            if (el.classList.contains('hidden') !== hidden) el.classList.toggle('hidden', hidden);
        }
        function setActive(el, active) {
            if (el.classList.contains('active') !== active) el.classList.toggle('active', active);
        }
        function setWidth(el, value) {
            if (el.style.width !== value) el.style.width = value;
        }

        // desc: Load custom accent color from server settings
        async function loadAccentColor() {
            try {
                const response = await fetch('/api/accent-color');
                const data = await response.json();
                if (data.accentColor) {
                    document.documentElement.style.setProperty('--accent-color', data.accentColor);
                }
            } catch (error) {
                console.error('Error loading accent color:', error);
            }
        }

        // desc: Show error overlay with retry option
        function showErrorOverlay() {
            const existing = document.querySelector('.error-overlay');
            if (existing) return;

            const overlay = document.createElement('div');
            overlay.className = 'error-overlay';
            overlay.innerHTML = `
                <div class="error-content">
                    <div class="error-icon">⚠️</div>
                    <div class="error-title">Connection Lost</div>
                    <div class="error-message">
                        Cannot reach Cxeify.<br>
                        Please check if the server is running.
                    </div>
                    <button class="error-button" onclick="handleRetry()">Retry Connection</button>
                </div>
            `;
            document.body.appendChild(overlay);
        }

        // desc: Hide error overlay when connection restored
        function hideErrorOverlay() {
            const overlay = document.querySelector('.error-overlay');
            if (overlay) {
                overlay.style.animation = 'fadeOut 0.3s ease';
                setTimeout(() => overlay.remove(), 300);
            }
        }

        // desc: Handle retry button click
        function handleRetry() {
            errorState.retryCount = 0;
            hideErrorOverlay();
            updatePlayback();
        }

        // desc: Handle playback errors with retry logic
        function handlePlaybackError(error) {
            // Only log non-network errors or first occurrence
            if (!(error instanceof TypeError && error.message.includes('NetworkError')) || errorState.retryCount === 0) {
                console.error('Playback error:', error);
            }
            
            errorState.hasError = true;
            errorState.retryCount++;

            if (errorState.retryCount < 3) {
                setTimeout(updatePlayback, 2000);
            } else {
                showErrorOverlay();
            }
        }

        const setupScreen = document.getElementById('setup-screen');
        const playerScreen = document.getElementById('player-screen');
        const playPauseBtn = document.getElementById('play-pause-btn');
        const prevBtn = document.getElementById('prev-btn');
        const nextBtn = document.getElementById('next-btn');
        const shuffleBtn = document.getElementById('shuffle-btn');
        const repeatBtn = document.getElementById('repeat-btn');
        const repeatOneIndicator = document.getElementById('repeat-one');
        const volumeSlider = document.getElementById('volume-slider');
        const progressBar = document.getElementById('progress-bar');
        const albumImage = document.getElementById('album-image');
        const trackName = document.getElementById('track-name');
        const artistName = document.getElementById('artist-name');
        const currentTime = document.getElementById('current-time');
        const duration = document.getElementById('duration');
        const progressFill = document.getElementById('progress-fill');
        const playIcon = document.getElementById('play-icon');
        const pauseIcon = document.getElementById('pause-icon');
        const likeBtn = document.getElementById('like-btn');
        const likeIconOutline = document.getElementById('like-icon-outline');
        const likeIconFilled = document.getElementById('like-icon-filled');

        let currentTrackId = null;
        let currentTrackSaved = false;

        // desc: Fetch saved state for a track and update the like button
        async function refreshLikeState(trackId) {
            if (!trackId) {
                currentTrackSaved = false;
                setLikeButtonState(false);
                return;
            }
            try {
                const response = await fetch(`/api/track-saved/${trackId}`);
                if (!response.ok) return;
                const data = await response.json();
                currentTrackSaved = !!data.saved;
                setLikeButtonState(currentTrackSaved);
            } catch (error) {
                console.error('Error checking like state:', error);
            }
        }

        // desc: Brief centered popup used for like/unlike feedback
        let toastTimer = null;
        function showToast(message, iconType) {
            const toast = document.getElementById('toast');
            const icon = document.getElementById('toast-icon');
            const msg = document.getElementById('toast-message');

            const heartFilled = '<path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/>';
            const heartBroken = '<path d="M16.5 3c-1.74 0-3.41.81-4.5 2.09C10.91 3.81 9.24 3 7.5 3 4.42 3 2 5.42 2 8.5c0 3.78 3.4 6.86 8.55 11.54L12 21.35l1.45-1.32C18.6 15.36 22 12.28 22 8.5 22 5.42 19.58 3 16.5 3zm-4.4 15.55l-.1.1-.1-.1C7.14 14.24 4 11.39 4 8.5 4 6.5 5.5 5 7.5 5c1.54 0 3.04.99 3.57 2.36h1.87C13.46 5.99 14.96 5 16.5 5c2 0 3.5 1.5 3.5 3.5 0 2.89-3.14 5.74-7.9 10.05z"/>';

            icon.innerHTML = iconType === 'removed' ? heartBroken : heartFilled;
            msg.textContent = message;
            toast.classList.add('visible');

            clearTimeout(toastTimer);
            toastTimer = setTimeout(() => {
                toast.classList.remove('visible');
            }, 2000);
        }

        // desc: Swap heart icon between outline and filled
        function setLikeButtonState(saved) {
            if (saved) {
                likeBtn.classList.add('active');
                likeIconOutline.classList.add('hidden');
                likeIconFilled.classList.remove('hidden');
                likeBtn.title = 'Remove from Liked Songs';
            } else {
                likeBtn.classList.remove('active');
                likeIconOutline.classList.remove('hidden');
                likeIconFilled.classList.add('hidden');
                likeBtn.title = 'Add to Liked Songs';
            }
        }

        // desc: Update player UI with current Spotify playback state
        async function updatePlayback() {
            try {
                const response = await fetch('/api/current');

                if (response.status === 401) {
                    // Token/refresh is dead — surface the re-auth banner and stop
                    // hammering /api/current until the user re-authorizes.
                    checkScopeStatus();
                    return;
                }

                if (!response.ok) {
                    throw new Error(`API returned ${response.status}`);
                }

                const data = await response.json();

                if (errorState.hasError) {
                    hideErrorOverlay();
                    errorState = { hasError: false, retryCount: 0 };
                }

                if (data.error === 'not_authenticated') {
                    setupScreen.classList.remove('hidden');
                    playerScreen.classList.add('hidden');
                    return;
                }

                setupScreen.classList.add('hidden');
                playerScreen.classList.remove('hidden');

                if (!data.item) {
                    setText(trackName, 'No Playback');
                    setText(artistName, 'Start Spotify on a device');
                    if (albumImage.src) albumImage.src = '';
                    currentTrackId = null;
                    setLikeButtonState(false);
                    localProgress.isPlaying = false;

                    const gradient = 'linear-gradient(135deg, #1a1a2e 0%, #16213e 100%)';
                    if (lastAlbumArtUrl !== gradient) {
                        document.getElementById('bg-layer').style.backgroundImage = gradient;
                        lastAlbumArtUrl = gradient;
                    }

                    updateVolumeSliderFill(volumeSlider.value);
                    return;
                }

                currentPlaybackState = data;

                if (data.item.id !== currentTrackId) {
                    currentTrackId = data.item.id;
                    refreshLikeState(currentTrackId);
                }

                setText(trackName, data.item.name);
                setText(artistName, data.item.artists.map(a => a.name).join(', '));

                // Album art background — only rewrite when the URL actually changes
                const albumArtUrl = data.item.album.images[0]?.url || '';
                if (albumArtUrl && albumArtUrl !== lastAlbumArtUrl) {
                    if (albumImage.src !== albumArtUrl) albumImage.src = albumArtUrl;
                    document.getElementById('bg-layer').style.backgroundImage = `url("${albumArtUrl}")`;
                    lastAlbumArtUrl = albumArtUrl;
                }

                setHidden(playIcon, !!data.is_playing);
                setHidden(pauseIcon, !data.is_playing);

                // Sync progress state for the local tick to interpolate between polls
                localProgress.ms = data.progress_ms;
                localProgress.duration = data.item.duration_ms;
                localProgress.syncedAt = Date.now();
                localProgress.isPlaying = !!data.is_playing;

                setText(duration, formatTime(data.item.duration_ms));
                if (!isSeeking) {
                    setText(currentTime, formatTime(data.progress_ms));
                    const percentage = (data.progress_ms / data.item.duration_ms) * 100;
                    setWidth(progressFill, percentage.toFixed(2) + '%');
                }

                if (!isAdjustingVolume && lastSetVolume === null) {
                    const volume = data.device?.volume_percent || 50;
                    if (volumeSlider.value != volume) {
                        volumeSlider.value = volume;
                        updateVolumeSliderFill(volume);
                    }
                }

                if (data.shuffle_state !== undefined) {
                    setActive(shuffleBtn, !!data.shuffle_state);
                }

                if (data.repeat_state !== undefined) {
                    const title = data.repeat_state === 'track' ? 'Repeat One'
                        : data.repeat_state === 'context' ? 'Repeat All' : 'Repeat Off';
                    setActive(repeatBtn, data.repeat_state !== 'off');
                    setHidden(repeatOneIndicator, data.repeat_state !== 'track');
                    if (repeatBtn.title !== title) repeatBtn.title = title;
                }
            } catch (error) {
                handlePlaybackError(error);
            }
        }

        playPauseBtn.addEventListener('click', async () => {
            if (!currentPlaybackState) return;
            await fetch('/api/play-pause', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ playing: currentPlaybackState.is_playing })
            });
            setTimeout(updatePlayback, 300);
        });

        prevBtn.addEventListener('click', async () => {
            await fetch('/api/previous', { method: 'POST' });
            setTimeout(updatePlayback, 500);
        });

        nextBtn.addEventListener('click', async () => {
            await fetch('/api/next', { method: 'POST' });
            setTimeout(updatePlayback, 500);
        });

        shuffleBtn.addEventListener('click', async () => {
            if (!currentPlaybackState) return;
            const currentState = currentPlaybackState.shuffle_state;
            const newState = !currentState;

            await fetch('/api/shuffle', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ state: newState })
            });

            setTimeout(updatePlayback, 300);
        });

        repeatBtn.addEventListener('click', async () => {
            if (!currentPlaybackState) return;
            const current = currentPlaybackState.repeat_state || 'off';
            let newState = 'off';

            if (current === 'off') {
                newState = 'context';
            } else if (current === 'context') {
                newState = 'track';
            } else {
                newState = 'off';
            }

            await fetch('/api/repeat', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ state: newState })
            });

            setTimeout(updatePlayback, 300);
        });

        likeBtn.addEventListener('click', async () => {
            if (!currentTrackId) return;
            const newSaved = !currentTrackSaved;
            setLikeButtonState(newSaved); // optimistic update
            try {
                const response = await fetch('/api/track-saved', {
                    method: 'PUT',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ id: currentTrackId, saved: newSaved })
                });
                if (!response.ok) {
                    setLikeButtonState(currentTrackSaved);
                    return;
                }
                currentTrackSaved = newSaved;
                showToast(newSaved ? 'Added to Liked Songs' : 'Removed from Liked Songs', newSaved ? 'added' : 'removed');
            } catch (error) {
                console.error('Error toggling like:', error);
                setLikeButtonState(currentTrackSaved);
            }
        });

        // Queue overlay
        let activeQueueTab = 'queue';

        function renderQueueTrack(track, index) {
            const trackEl = document.createElement('div');
            trackEl.className = 'playlist-track';
            trackEl.innerHTML = `
                <div class="playlist-track-number">${index + 1}</div>
                <img class="playlist-track-image" src="${track.album?.images?.[0]?.url || ''}" alt="">
                <div class="playlist-track-info">
                    <div class="playlist-track-name">${track.name || 'Unknown'}</div>
                    <div class="playlist-track-artist">${track.artists?.map(a => a.name).join(', ') || 'Unknown'}</div>
                </div>
            `;
            return trackEl;
        }

        async function loadQueueList() {
            const tracksList = document.getElementById('queue-tracks-list');
            tracksList.innerHTML = '<div class="playlist-loading"><div class="spinner"></div><div>Loading queue...</div></div>';

            try {
                const response = await fetch('/api/queue');
                if (!response.ok) {
                    tracksList.innerHTML = '<div class="playlist-loading">Error loading queue</div>';
                    return;
                }
                const data = await response.json();
                const queue = data.queue || [];
                tracksList.innerHTML = '';

                if (queue.length === 0) {
                    tracksList.innerHTML = '<div class="playlist-loading">Queue is empty</div>';
                    return;
                }

                queue.forEach((track, idx) => {
                    if (!track) return;
                    tracksList.appendChild(renderQueueTrack(track, idx));
                });
            } catch (error) {
                console.error('Error loading queue:', error);
                tracksList.innerHTML = '<div class="playlist-loading">Error loading queue</div>';
            }
        }

        async function loadHistoryList() {
            const tracksList = document.getElementById('queue-tracks-list');
            tracksList.innerHTML = '<div class="playlist-loading"><div class="spinner"></div><div>Loading history...</div></div>';

            try {
                const response = await fetch('/api/recently-played?limit=30');
                if (!response.ok) {
                    tracksList.innerHTML = '<div class="playlist-loading">Error loading history</div>';
                    return;
                }
                const data = await response.json();
                const items = data.items || [];
                tracksList.innerHTML = '';

                if (items.length === 0) {
                    tracksList.innerHTML = '<div class="playlist-loading">No recently played tracks</div>';
                    return;
                }

                items.forEach((item, idx) => {
                    if (!item || !item.track) return;
                    tracksList.appendChild(renderQueueTrack(item.track, idx));
                });
            } catch (error) {
                console.error('Error loading history:', error);
                tracksList.innerHTML = '<div class="playlist-loading">Error loading history</div>';
            }
        }

        function switchQueueTab(tab) {
            if (activeQueueTab === tab) return;
            activeQueueTab = tab;

            document.querySelectorAll('.queue-tab').forEach(btn => {
                btn.classList.toggle('active', btn.dataset.tab === tab);
            });

            if (tab === 'queue') {
                loadQueueList();
            } else {
                loadHistoryList();
            }
        }

        function openQueueOverlay() {
            document.getElementById('queue-overlay').classList.add('active');
            if (activeQueueTab === 'queue') {
                loadQueueList();
            } else {
                loadHistoryList();
            }
        }

        function closeQueueOverlay() {
            document.getElementById('queue-overlay').classList.remove('active');
        }

        // desc: Progress bar drag/touch handlers for seeking
        let isDraggingProgress = false;
        let seekDebounceTimer = null;

        async function performSeek(clientX) {
            if (!currentPlaybackState) return;

            const rect = progressBar.getBoundingClientRect();
            const percentage = Math.max(0, Math.min(1, (clientX - rect.left) / rect.width));
            const position = Math.floor(currentPlaybackState.item.duration_ms * percentage);

            clearTimeout(seekDebounceTimer);
            seekDebounceTimer = setTimeout(async () => {
                await fetch('/api/seek', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ position })
                });
                setTimeout(() => {
                    isSeeking = false;
                }, 300);
            }, 100);
        }

        progressBar.addEventListener('mousedown', (e) => {
            isDraggingProgress = true;
            isSeeking = true;
            performSeek(e.clientX);
        });

        progressBar.addEventListener('touchstart', (e) => {
            isDraggingProgress = true;
            isSeeking = true;
            performSeek(e.touches[0].clientX);
        });

        document.addEventListener('mousemove', (e) => {
            if (isDraggingProgress) {
                performSeek(e.clientX);
            }
        });

        document.addEventListener('touchmove', (e) => {
            if (isDraggingProgress) {
                performSeek(e.touches[0].clientX);
            }
        });

        document.addEventListener('mouseup', () => {
            if (isDraggingProgress) {
                isDraggingProgress = false;
            }
        });

        document.addEventListener('touchend', () => {
            if (isDraggingProgress) {
                isDraggingProgress = false;
            }
        });

        volumeSlider.addEventListener('mousedown', () => {
            isAdjustingVolume = true;
        });

        volumeSlider.addEventListener('touchstart', () => {
            isAdjustingVolume = true;
        });

        volumeSlider.addEventListener('mouseup', () => {
            setTimeout(() => {
                isAdjustingVolume = false;
            }, 2000);
        });

        volumeSlider.addEventListener('touchend', () => {
            setTimeout(() => {
                isAdjustingVolume = false;
            }, 2000);
        });

        volumeSlider.addEventListener('input', (e) => {
            const newVolume = parseInt(e.target.value);
            lastSetVolume = newVolume;
            updateVolumeSliderFill(newVolume);

            // Debounce: nur alle 200ms die Lautstärke senden
            clearTimeout(volumeDebounceTimer);
            volumeDebounceTimer = setTimeout(async () => {
                await fetch('/api/volume', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ volume: newVolume })
                });
            }, 200);
        });

        // desc: Update volume slider fill based on current volume
        function updateVolumeSliderFill(volume) {
            const accentColor = getComputedStyle(document.documentElement).getPropertyValue('--accent-color').trim();
            const percentage = volume;
            volumeSlider.style.background = `linear-gradient(to right, ${accentColor} 0%, ${accentColor} ${percentage}%, rgba(255, 255, 255, 0.25) ${percentage}%, rgba(255, 255, 255, 0.25) 100%)`;
        }

        function formatTime(ms) {
            const totalSeconds = Math.floor(ms / 1000);
            const minutes = Math.floor(totalSeconds / 60);
            const seconds = totalSeconds % 60;
            return `${minutes}:${seconds.toString().padStart(2, '0')}`;
        }

        // Playlist functionality
        let currentContext = null;
        let playlistState = {
            offset: 0,
            hasMore: true,
            loading: false,
            totalTracks: 0
        };

        // Context is now checked only when opening the playlist overlay

        function renderTrack(track, index) {
            const trackEl = document.createElement('div');
            trackEl.className = 'playlist-track';
            
            if (track.uri === currentContext.currentTrackUri) {
                trackEl.classList.add('current');
            }

            trackEl.innerHTML = `
                <div class="playlist-track-number">${index + 1}</div>
                <img class="playlist-track-image" src="${track.album?.images?.[0]?.url || ''}" alt="">
                <div class="playlist-track-info">
                    <div class="playlist-track-name">${track.name}</div>
                    <div class="playlist-track-artist">${track.artists?.map(a => a.name).join(', ') || 'Unknown'}</div>
                </div>
                <button class="playlist-track-play-btn" onclick="event.stopPropagation()">
                    <svg viewBox="0 0 24 24">
                        <path d="M8 5v14l11-7z"/>
                    </svg>
                </button>
            `;

            // Add click handler only to the play button
            const playBtn = trackEl.querySelector('.playlist-track-play-btn');
            playBtn.addEventListener('click', (e) => {
                e.stopPropagation();
                playTrackFromPlaylist(track.uri);
            });

            return trackEl;
        }

        async function loadMoreTracks() {
            if (playlistState.loading || !playlistState.hasMore) return;
            
            playlistState.loading = true;
            const tracksList = document.getElementById('playlist-tracks-list');

            try {
                const response = await fetch(`/api/context/${currentContext.id}/tracks?type=${currentContext.type}&offset=${playlistState.offset}&limit=20`);
                
                if (!response.ok) {
                    const data = await response.json().catch(() => ({}));
                    
                    console.error(`[PLAYLIST] API Error - Status: ${response.status}, Data:`, data);
                    
                    // Handle rate limiting
                    if (response.status === 429) {
                        if (playlistState.offset === 0) {
                            const retryAfter = response.headers.get('Retry-After');
                            let waitMessage = '';
                            
                            if (retryAfter) {
                                const seconds = parseInt(retryAfter);
                                const minutes = Math.round(seconds / 60);
                                const hours = Math.round(minutes / 60);
                                
                                if (hours >= 1) {
                                    waitMessage = `Please wait approximately ${hours} hour${hours > 1 ? 's' : ''}.`;
                                } else if (minutes >= 1) {
                                    waitMessage = `Please wait approximately ${minutes} minute${minutes > 1 ? 's' : ''}.`;
                                } else {
                                    waitMessage = `Please wait ${seconds} seconds.`;
                                }
                            }
                            
                            tracksList.innerHTML = `
                                <div class="playlist-loading">
                                    Spotify has rate limited API access.<br>
                                    ${waitMessage}<br><br>
                                    Playback controls continue to work normally.<br><br>
                                    <button class="load-more-btn" onclick="location.reload()" style="max-width: 200px; margin-top: 20px;">
                                        Try Again
                                    </button>
                                </div>`;
                        }
                        playlistState.hasMore = false;
                        playlistState.loading = false;
                        return;
                    }
                    
                    // Only show Spotify-generated playlist message for actual 404s with that specific error
                    if (response.status === 404 && data.error && data.error.includes('Spotify-generated')) {
                        if (playlistState.offset === 0) {
                            tracksList.innerHTML = '<div class="playlist-loading">This playlist cannot be accessed.<br>Some Spotify-generated playlists may not be available through the API.</div>';
                        }
                        playlistState.hasMore = false;
                        playlistState.loading = false;
                        return;
                    }
                    
                    // For other errors, log them and show a generic error
                    console.error(`Error loading tracks: HTTP ${response.status}: ${response.statusText}`, data);
                    throw new Error(`HTTP ${response.status}: ${response.statusText}`);
                }
                
                const data = await response.json();

                // Check if items exist
                if (!data.items || !Array.isArray(data.items) || data.items.length === 0) {
                    playlistState.hasMore = false;
                    playlistState.loading = false;
                    
                    if (playlistState.offset === 0 && (!data.items || data.items.length === 0)) {
                        tracksList.innerHTML = '<div class="playlist-loading">This playlist is empty.</div>';
                    }
                    return;
                }

                data.items.forEach((item, idx) => {
                    const track = item.track;
                    if (!track) return;
                    
                    const globalIndex = playlistState.offset + idx;
                    const trackEl = renderTrack(track, globalIndex);
                    tracksList.appendChild(trackEl);
                });

                playlistState.offset += data.items.length;
                playlistState.hasMore = data.hasMore !== false && data.items.length > 0;
                playlistState.totalTracks = data.total || 0;

                // Update header with correct total
                if (data.total) {
                    document.getElementById('playlist-overlay-type').textContent = 
                        `${currentContext.type === 'playlist' ? 'Playlist' : 'Album'} · ${data.total} songs`;
                }

            } catch (error) {
                console.error('Error loading tracks:', error);
                playlistState.hasMore = false;
                
                if (playlistState.offset === 0) {
                    tracksList.innerHTML = `<div class="playlist-loading">Error loading tracks. Please try again.</div>`;
                }
            } finally {
                playlistState.loading = false;
                // Update or add load more button AFTER setting loading = false
                updateLoadMoreButton();
            }
        }

        function updateLoadMoreButton() {
            const tracksList = document.getElementById('playlist-tracks-list');
            let loadMoreBtn = document.getElementById('load-more-btn');
            
            // Remove existing button if present
            if (loadMoreBtn) {
                loadMoreBtn.remove();
            }
            
            // Add button if there are more tracks to load
            if (playlistState.hasMore) {
                loadMoreBtn = document.createElement('button');
                loadMoreBtn.id = 'load-more-btn';
                loadMoreBtn.className = 'load-more-btn';
                loadMoreBtn.textContent = playlistState.loading ? 'Loading...' : 'Load More';
                loadMoreBtn.disabled = playlistState.loading;
                loadMoreBtn.onclick = () => loadMoreTracks();
                tracksList.appendChild(loadMoreBtn);
            }
        }

        async function openPlaylistOverlay() {
            const overlay = document.getElementById('playlist-overlay');
            overlay.classList.add('active');

            // Show loading spinner while fetching fresh context
            const tracksList = document.getElementById('playlist-tracks-list');
            
            tracksList.innerHTML = '<div class="playlist-loading"><div class="spinner"></div><div>Loading playlist...</div></div>';

            // Fetch fresh context data
            try {
                const response = await fetch('/api/context');
                if (!response.ok) {
                    tracksList.innerHTML = '<div class="playlist-loading">Error loading playlist</div>';
                    return;
                }
                
                const data = await response.json();
                
                if (!data.hasContext || !(data.type === 'playlist' || data.type === 'album')) {
                    tracksList.innerHTML = '<div class="playlist-loading">No playlist or album playing</div>';
                    return;
                }

                currentContext = data;

                // Set header info with fresh data
                document.getElementById('playlist-overlay-name').textContent = currentContext.name || 'Unknown';
                document.getElementById('playlist-overlay-type').textContent = 
                    `${currentContext.type === 'playlist' ? 'Playlist' : 'Album'} · ${currentContext.totalTracks || 0} songs`;
                
                if (currentContext.image) {
                    document.getElementById('playlist-overlay-image').src = currentContext.image;
                }

                // Reset state
                playlistState = {
                    offset: 0,
                    hasMore: true,
                    loading: false,
                    totalTracks: 0
                };

                // Load first batch
                tracksList.innerHTML = '';
                await loadMoreTracks();
            } catch (error) {
                console.error('Error opening playlist overlay:', error);
                tracksList.innerHTML = '<div class="playlist-loading">Error loading playlist</div>';
            }
        }

        function closePlaylistOverlay() {
            document.getElementById('playlist-overlay').classList.remove('active');
        }

        async function playTrackFromPlaylist(trackUri) {
            try {
                const response = await fetch('/api/play-track', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        contextUri: currentContext.uri,
                        trackUri: trackUri
                    })
                });

                if (response.ok) {
                    closePlaylistOverlay();
                    setTimeout(updatePlayback, 500);
                }
            } catch (error) {
                console.error('Error playing track:', error);
            }
        }

        // desc: Warn the user if the saved token is missing newly required scopes
        let scopePollTimer = null;

        async function checkScopeStatus() {
            try {
                const response = await fetch('/api/scope-status');
                if (!response.ok) return false;
                const data = await response.json();
                const banner = document.getElementById('scope-banner');
                const message = document.getElementById('scope-banner-message');

                const needsReauth = !data.ok;

                if (needsReauth) {
                    if (!banner.dataset.waiting) {
                        let text;
                        if (data.reason === 'missing_scopes') {
                            text = `New features need additional Spotify permissions (${(data.missing || []).length} missing).`;
                        } else if (data.reason === 'not_authenticated') {
                            text = 'Spotify account not connected. Please authorize.';
                        } else {
                            text = 'Your Spotify session has expired. Please re-authorize.';
                        }
                        message.textContent = text;
                    }
                    banner.classList.remove('hidden');
                    return false;
                }

                banner.classList.add('hidden');
                delete banner.dataset.waiting;
                return true;
            } catch (error) {
                console.error('Error checking scope status:', error);
                return false;
            }
        }

        // desc: After user clicks Re-authorize (opens in default browser), poll until scopes land
        function onReauthClicked() {
            const banner = document.getElementById('scope-banner');
            const message = document.getElementById('scope-banner-message');
            banner.dataset.waiting = '1';
            message.textContent = 'Waiting for authorization in your browser...';

            clearInterval(scopePollTimer);
            scopePollTimer = setInterval(async () => {
                const ok = await checkScopeStatus();
                if (ok) {
                    clearInterval(scopePollTimer);
                    scopePollTimer = null;
                    updatePlayback();
                }
            }, 2000);
        }

        // desc: Local tick interpolates progress between 2s server syncs so the
        // counter updates every second and the progress bar moves smoothly.
        function tickLocalProgress() {
            if (!localProgress.duration || isSeeking) return;
            const elapsed = localProgress.isPlaying ? (Date.now() - localProgress.syncedAt) : 0;
            const position = Math.min(localProgress.duration, localProgress.ms + elapsed);
            setText(currentTime, formatTime(position));
            setWidth(progressFill, ((position / localProgress.duration) * 100).toFixed(2) + '%');
        }

        // Initialize
        loadAccentColor();
        checkScopeStatus();
        updatePlayback();
        setInterval(updatePlayback, 2000); // Every 2 seconds
        setInterval(tickLocalProgress, 250); // Smooth local interpolation
        updateVolumeSliderFill(50);
    </script>

    <!-- Re-auth banner (shown when saved token is missing required scopes) -->
    <div id="scope-banner" class="scope-banner hidden">
        <span id="scope-banner-message">New features need additional Spotify permissions.</span>
        <a id="scope-banner-link" href="/auth/start?force=1" target="_blank" rel="noopener" onclick="onReauthClicked()">
            <button>Re-authorize</button>
        </a>
    </div>

    <!-- Toast -->
    <div id="toast" class="toast">
        <svg id="toast-icon" viewBox="0 0 24 24"></svg>
        <span id="toast-message"></span>
    </div>

    <!-- Queue Icon -->
    <div id="queue-icon" class="overlay-icon" onclick="openQueueOverlay()" title="Queue">
        <svg viewBox="0 0 24 24">
            <path d="M15 6H3v2h12V6zm0 4H3v2h12v-2zM3 16h8v-2H3v2zM22 11l-6 4.5V7z"/>
        </svg>
    </div>

    <!-- Playlist Icon -->
    <div id="playlist-icon" class="overlay-icon" onclick="openPlaylistOverlay()" title="Playlist">
        <svg viewBox="0 0 24 24">
            <path d="M15 6H3v2h12V6zm0 4H3v2h12v-2zM3 16h8v-2H3v2zM17 6v8.18c-.31-.11-.65-.18-1-.18-1.66 0-3 1.34-3 3s1.34 3 3 3 3-1.34 3-3V8h3V6h-5z"/>
        </svg>
    </div>

    <!-- Playlist Overlay -->
    <div id="playlist-overlay" class="playlist-overlay">
        <div class="playlist-header">
            <div class="playlist-header-content">
                <img id="playlist-overlay-image" class="playlist-header-image" src="" alt="">
                <div class="playlist-header-info">
                    <h3 id="playlist-overlay-name">Playlist Name</h3>
                    <p id="playlist-overlay-type">Playlist · 0 songs</p>
                </div>
            </div>
            <button class="playlist-close-btn" onclick="closePlaylistOverlay()">
                <svg viewBox="0 0 24 24">
                    <path d="M19 6.41L17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12z"/>
                </svg>
            </button>
        </div>
        <div id="playlist-tracks-list" class="playlist-tracks">
            <!-- Tracks will be loaded here -->
        </div>
    </div>

    <!-- Queue Overlay -->
    <div id="queue-overlay" class="playlist-overlay">
        <div class="playlist-header">
            <div class="queue-tabs">
                <button class="queue-tab active" data-tab="queue" onclick="switchQueueTab('queue')">Up Next</button>
                <button class="queue-tab" data-tab="history" onclick="switchQueueTab('history')">History</button>
            </div>
            <button class="playlist-close-btn" onclick="closeQueueOverlay()">
                <svg viewBox="0 0 24 24">
                    <path d="M19 6.41L17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12z"/>
                </svg>
            </button>
        </div>
        <div id="queue-tracks-list" class="playlist-tracks">
            <!-- Queue or history tracks will be loaded here -->
        </div>
    </div>
</body>
